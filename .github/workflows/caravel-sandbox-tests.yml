name: Caravel sandbox adapter checks
on:
  push:
    branches: [feature/caravel-sandbox-integration]
    paths:
      - 'supabase/functions/_shared/caravel-*.ts'
      - 'supabase/functions/_shared/partner-api.ts'
      - 'supabase/functions/_shared/api-quote-contract.mjs'
      - 'tests/caravel-*.test.mjs'
      - 'tests/local-ts-esm-loader.mjs'
      - '.github/workflows/caravel-sandbox-tests.yml'
  pull_request:
    paths:
      - 'supabase/functions/_shared/caravel-*.ts'
      - 'supabase/functions/_shared/partner-api.ts'
      - 'supabase/functions/_shared/api-quote-contract.mjs'
      - 'tests/caravel-*.test.mjs'
      - 'tests/local-ts-esm-loader.mjs'
      - '.github/workflows/caravel-sandbox-tests.yml'
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests without API secrets
        run: node --experimental-strip-types --test tests/caravel-sandbox-adapter.test.mjs tests/caravel-verified-rules.test.mjs tests/caravel-quote-verification.test.mjs tests/caravel-normalize.test.mjs tests/caravel-booking.test.mjs tests/caravel-diagnostics.test.mjs
      - name: TypeScript type check
        run: npx --yes --package typescript@5.9.3 tsc --noEmit --target es2022 --module esnext --moduleResolution bundler --lib es2022,dom --allowImportingTsExtensions supabase/functions/_shared/caravel-sandbox-adapter.ts supabase/functions/_shared/caravel-verified-rules.ts supabase/functions/_shared/caravel-quote-verification.ts supabase/functions/_shared/caravel-normalize.ts supabase/functions/_shared/caravel-booking.ts supabase/functions/_shared/caravel-diagnostics.ts
