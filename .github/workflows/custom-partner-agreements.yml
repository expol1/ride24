name: Ride24 Custom Partner Agreements QA
on:
  pull_request:
    paths:
      - 'partner-dashboard.html'
      - 'admin/index.html'
      - 'assets/js/partner-custom-agreements.js'
      - 'assets/js/admin-custom-agreements.js'
      - 'supabase/functions/admin-partner-custom-agreement/**'
      - 'supabase/migrations/*custom_partner_agreements.sql'
      - 'tests/backend-hardening/test-custom-partner-agreements.mjs'
      - 'tests/backend-hardening/test-standard-agreement-*.mjs'
      - 'docs/standard-partnership-agreement-v2.0.txt'
      - '.github/workflows/custom-partner-agreements.yml'
  push:
    branches: [main]
    paths:
      - 'partner-dashboard.html'
      - 'admin/index.html'
      - 'assets/js/partner-custom-agreements.js'
      - 'assets/js/admin-custom-agreements.js'
      - 'supabase/functions/admin-partner-custom-agreement/**'
      - 'supabase/migrations/*custom_partner_agreements.sql'
      - 'tests/backend-hardening/test-custom-partner-agreements.mjs'
      - 'tests/backend-hardening/test-standard-agreement-*.mjs'
      - 'docs/standard-partnership-agreement-v2.0.txt'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check custom agreement JavaScript syntax
        run: |
          node --check assets/js/admin-custom-agreements.js
          node --check assets/js/partner-custom-agreements.js
      - name: Verify PDF checksum, signing guard and standard fallback
        run: node --test tests/backend-hardening/test-custom-partner-agreements.mjs
      - name: Install pinned test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: tests/backend-hardening
      - name: Verify standard v2.0 rendering and isolated acceptance
        run: |
          node --test tests/backend-hardening/test-standard-agreement-v2.mjs
          node tests/backend-hardening/test-standard-agreement-db.mjs
