name: Booking time fee tests
on:
  pull_request:
    paths:
      - 'supabase/functions/_shared/booking-items.mjs'
      - 'supabase/functions/_shared/booking-options.mjs'
      - 'tests/backend-hardening/test-automatic-time-fees.mjs'
      - 'tests/backend-hardening/test-booking-items.mjs'
      - 'tests/backend-hardening/test-booking-options.mjs'
      - '.github/workflows/booking-time-fees.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/backend-hardening/test-automatic-time-fees.mjs tests/backend-hardening/test-booking-items.mjs tests/backend-hardening/test-booking-options.mjs
