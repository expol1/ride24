name: Pegasus JSON export isolated tests
on:
  push:
    paths:
      - 'supabase/functions/pegasus-booking-export/**'
      - 'docs/integrations/pegasus-json-export/**'
      - '.github/workflows/pegasus-export-tests.yml'
  pull_request:
    paths:
      - 'supabase/functions/pegasus-booking-export/**'
      - 'docs/integrations/pegasus-json-export/**'
      - '.github/workflows/pegasus-export-tests.yml'
permissions:
  contents: read
jobs:
  contract-and-http:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check isolated Pegasus tests
        run: node --test docs/integrations/pegasus-json-export/tests/*.test.mjs
