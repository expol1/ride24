<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weryfikacja Rezerwacji - Ride24</title>
    <meta name="description" content="Private Ride24 booking verification page.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://ride24.pl/verify.html">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/helper/supabaseConfig.js"></script>

    <style>
        :root {
            --brand-blue: #10386a;
            --brand-green: #74d941;
            --text-dark: #333;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f4f7f9;
            display: flex;
            justify-content: center;
            padding: 20px;
            color: var(--text-dark);
        }

        .verify-card {
            background: white;
            width: 100%;
            max-width: 460px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: var(--brand-blue);
            color: white;
            padding: 25px;
            text-align: center;
        }

        .status-badge {
            display: inline-block;
            padding: 10px 18px;
            border-radius: 50px;
            font-weight: bold;
            margin-top: 12px;
            font-size: 14px;
        }

        .status-paid {
            background: var(--brand-green);
            color: var(--brand-blue);
        }

        .status-error {
            background: #ff4d4d;
            color: white;
        }

        .content {
            padding: 25px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .label {
            color: #777;
            font-size: 14px;
        }

        .value {
            font-weight: 600;
            text-align: right;
        }

        .loader {
            text-align: center;
            padding: 40px;
            color: var(--brand-blue);
            font-weight: bold;
        }

        .ok {
            color: var(--brand-green);
            font-weight: bold;
        }

        .bad {
            color: #ff4d4d;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="verify-card" id="app">
    <div class="loader">Sprawdzanie autentyczności vouchera...</div>
</div>

<script type="module">
const supabase = window.supabaseClient;

function element(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
}

function renderError(title, message) {
    const app = document.getElementById("app");
    app.replaceChildren();
    const header = element("div", "header status-error", title);
    const content = element("div", "content");
    content.appendChild(element("div", "bad", message));
    app.append(header, content);
}

function addRow(content, label, value, valueClass = "value") {
    const row = element("div", "info-row");
    row.append(element("span", "label", label), element("span", valueClass, value || "-"));
    content.appendChild(row);
}

async function verify() {
    const app = document.getElementById("app");
    const code = String(new URLSearchParams(window.location.search).get("code") || "").trim().toUpperCase();
    if (!code || code.length > 30) {
        renderError("BŁĄD / ERROR", "Brak lub nieprawidłowy kod rezerwacji / Missing or invalid booking code");
        return;
    }

    const { data, error } = await supabase.rpc("verify_voucher_public", { p_code: code });
    const booking = Array.isArray(data) ? data[0] : data;
    if (error || !booking) {
        renderError("NIEWAŻNY VOUCHER / INVALID VOUCHER", `Kod / Code ${code} nie istnieje / does not exist`);
        return;
    }

    const valid = booking.authentic === true;
    app.replaceChildren();

    const header = element("div", "header");
    header.appendChild(element("div", "", "WERYFIKACJA VOUCHERA / VOUCHER VERIFICATION"));
    header.firstChild.style.cssText = "font-size:12px;opacity:.8";
    const codeNode = element("div", "", booking.reservation_code || code);
    codeNode.style.cssText = "font-size:24px;font-weight:bold";
    header.appendChild(codeNode);
    header.appendChild(element("div", `status-badge ${valid ? "status-paid" : "status-error"}`, valid ? "✓ WAŻNY / VALID" : "✗ NIEWAŻNY / INVALID"));

    const content = element("div", "content");
    addRow(content, "Status:", valid ? "Aktywna / Active" : "Nieważna / Invalid", `value ${valid ? "ok" : "bad"}`);
    addRow(content, "Klasa pojazdu / Vehicle class:", booking.class_code);
    addRow(content, "Miejsce odbioru / Pickup location:", booking.pickup_location);
    addRow(content, "Odbiór / Pickup:", `${booking.start_date || "-"} ${String(booking.pickup_time || "").slice(0,5)}`.trim());
    addRow(content, "Zwrot / Return:", `${booking.end_date || "-"} ${String(booking.return_time || "").slice(0,5)}`.trim());

    const footer = element("div", "", `Ride24 Secure Verification\n${new Date().toLocaleString()}`);
    footer.style.cssText = "margin-top:20px;font-size:11px;color:#aaa;text-align:center;white-space:pre-line";
    content.appendChild(footer);
    app.append(header, content);
}

verify().catch(() => renderError("BŁĄD / ERROR", "Nie udało się sprawdzić vouchera / Verification failed"));
</script>

</body>
</html>
